# autopilot-runtime: Worker B's plane (SPEC-18, 13, 14, 15, 16).
# Import the manifest contract from platform_shared - never re-implement it.
[project]
name = "autopilot-runtime"
version = "0.1.0"
description = "AutoPilot runtime plane: secrets, deployment lifecycle, Kubernetes renderer, ingress, routing"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43.0",
  "asyncpg>=0.29",
  "httpx>=0.27",
  "platform-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runtime"]
