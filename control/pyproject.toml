# autopilot-control: the Spec-04 API process skeleton. Coordinator-owned core;
# Worker sessions extend under src/control per their spec assignments.
[project]
name = "autopilot-control"
version = "0.1.0"
description = "AutoPilot control plane: FastAPI shell, DB pool, tenant scoping"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.2",
  "platform-shared",
  "autopilot-runtime",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control"]
