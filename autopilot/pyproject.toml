# autopilot-research: Worker D's research plane (SPEC-30..35).
# SPEC-30 is the only module here today; dataset/, det/, rca/, agent/ and eval/
# join as their specs open.  The coordinator adds this package to the uv
# workspace when the vertical slice unlocks the track (PARALLEL-PLAN phase 5).
[project]
name = "autopilot-research"
version = "0.1.0"
description = "AutoPilot research plane: fault injection harness and labelled dataset (SPEC-30)"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
