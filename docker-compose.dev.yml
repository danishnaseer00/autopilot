# paas/docker-compose.dev.yml — LOCAL unit-test infrastructure ONLY.
# It provides Postgres(+TimescaleDB)+Redis for unit/contract tests in worker
# sessions. It is NOT the deployment: the platform runs on the AWS k3s node
# (SPEC-39 §11). Never treat this file as "the environment".
services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    command: postgres -c shared_preload_libraries=timescaledb
    environment:
      # superuser used only for the init script (roles + the three databases)
      POSTGRES_USER: autopilot_bootstrap
      POSTGRES_PASSWORD: devonly-change-me
      POSTGRES_DB: autopilot_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autopilot_bootstrap -d autopilot_platform"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
