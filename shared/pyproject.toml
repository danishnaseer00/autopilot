# platform-shared: the package both the PaaS plane and AutoPilot import.
# Owner: coordinator (paas/README ownership map). SPEC-06 lives here because it
# is the only jointly-owned spec; changes need BOTH owners' sign-off (R-15) and
# the fixture test in tests/ must pass for both suites (R-17).
[project]
name = "platform-shared"
version = "0.1.0"
description = "Shared contracts for the AutoPilot platform: app manifest (SPEC-06) and graph"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_shared"]
